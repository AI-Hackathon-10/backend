spring:
  datasource:
    url: jdbc:h2:mem:report-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  s3:
    region: ap-northeast-2
    bucket: report-test-bucket
    report-prefix: reports
    presigned-url-expiration-seconds: 600
    max-report-size-bytes: 10485760
