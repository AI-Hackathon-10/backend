spring:
  application:
    name: ktb-ai-hackathon

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER}

  servlet:
    multipart:
      max-file-size: ${SERVLET_MULTIPART_MAX_FILE_SIZE:25MB}
      max-request-size: ${SERVLET_MULTIPART_MAX_REQUEST_SIZE:25MB}

  jpa:
    hibernate:
      ddl-auto: create
jwt:
  secret: ${JWT_SECRET}
  access-token-expired-seconds: ${JWT_ACCESS_TOKEN_EXPIRED_SECONDS}
  refresh-token-expired-seconds: ${JWT_REFRESH_TOKEN_EXPIRED_SECONDS}

aws:
  region: ap-northeast-2
  s3:
    bucket: pillid-images-team10
  credentials:
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}

fastapi:
  base-url: ${FASTAPI_BASE_URL}

openai:
  api-key: ${OPENAI_API_KEY}
  whisper:
    api-url: https://api.openai.com/v1/audio/transcriptions
    model: whisper-1
    language: ko
  tts:
    api-url: https://api.openai.com/v1/audio/speech
    model: tts-1
    voice: nova