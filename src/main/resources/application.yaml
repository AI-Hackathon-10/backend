spring:
  application:
    name: ktb-ai-hackathon

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER}

  jpa:
    hibernate:
      ddl-auto: update
jwt:
  secret: ${JWT_SECRET}
  access-token-expired-seconds: ${JWT_ACCESS_TOKEN_EXPIRED_SECONDS}
  refresh-token-expired-seconds: ${JWT_REFRESH_TOKEN_EXPIRED_SECONDS}

aws:
  region: ap-northeast-2
  s3:
    bucket: pillid-images-team10
  credentials:
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}

